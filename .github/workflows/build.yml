name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3' # Pinned. Quotes are required so YAML does not parse it as a number.

      # TEMPORARY: API inspection steps. Remove them (and re-enable the build below) once their results are no longer needed.
      - name: Find classes (TEMPORARY)
        env:
          INSPECT_VALUES: >-
            DeferredRegister, DeferredHolder, EntityType, MobCategory, Entity, Level, Item, ItemStack, Items,
            Registries, BuiltInRegistries, ResourceLocation, DyeColor, DataComponents, DataComponentType,
            SynchedEntityData, EntityDataAccessor, EntityDataSerializers, CompoundTag, CreativeModeTab,
            CreativeModeTabs, BuildCreativeModeTabContentsEvent, Component, Dist, EventBusSubscriber,
            FMLEnvironment, Codec, StreamCodec, ByteBufCodecs
        run: |
          # Values are separated by commas; a failure does not stop the others.
          status=0
          IFS=',' read -ra VALUES <<< "$INSPECT_VALUES"
          for raw in "${VALUES[@]}"; do
            value="$(echo "$raw" | xargs)"
            if [ -z "$value" ]; then
              continue
            fi
            echo "##### findClass: $value"
            gradle findClass "-PsimpleName=$value" --console=plain -q || status=1
          done
          exit $status

      - name: Inspect APIs (TEMPORARY)
        if: ${{ !cancelled() }}
        env:
          INSPECT_VALUES: >-
            net.neoforged.fml.common.Mod, net.neoforged.bus.api.IEventBus
        run: |
          # Fully qualified names, separated by commas (nested classes with $); a failure does not stop the others.
          status=0
          IFS=',' read -ra VALUES <<< "$INSPECT_VALUES"
          for raw in "${VALUES[@]}"; do
            value="$(echo "$raw" | xargs)"
            if [ -z "$value" ]; then
              continue
            fi
            echo "##### inspectApi: $value"
            gradle inspectApi "-PclassName=$value" --console=plain -q || status=1
          done
          exit $status

      # TEMPORARILY DISABLED to save time while inspecting the API. Remove the "if: false" lines to re-enable.
      - name: Build
        if: ${{ false }}
        run: gradle build --stacktrace

      - name: Upload jars
        if: ${{ false }}
        uses: actions/upload-artifact@v4
        with:
          name: htzcars-jars
          path: build/libs/*.jar
          if-no-files-found: error
