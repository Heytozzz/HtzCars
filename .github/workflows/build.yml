name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3' # Pinned. Quotes are required so YAML does not parse it as a number.

      - name: Build
        run: gradle build --stacktrace

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: htzcars-jars
          path: build/libs/*.jar
          if-no-files-found: error

      # TEMPORARY steps: API inspection. Remove them once the main class is verified.
      # "if: always()" makes them run even if the build step failed, so their output is always in the log.
      - name: "[TEMP] findClass Mod"
        if: always()
        run: gradle findClass -PsimpleName=Mod --console=plain --stacktrace

      - name: "[TEMP] findClass ModContainer"
        if: always()
        run: gradle findClass -PsimpleName=ModContainer --console=plain --stacktrace

      - name: "[TEMP] findClass IEventBus"
        if: always()
        run: gradle findClass -PsimpleName=IEventBus --console=plain --stacktrace

      - name: "[TEMP] findClass Logger"
        if: always()
        run: gradle findClass -PsimpleName=Logger --console=plain --stacktrace
