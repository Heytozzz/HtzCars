name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3' # Pinned. Quotes are required so YAML does not parse it as a number.

      # TEMPORARY: API inspection step. Remove it (and re-enable the build below) once its results are no longer needed.
      - name: Inspect APIs (TEMPORARY)
        env:
          INSPECT_VALUES: >-
            net.neoforged.neoforge.registries.DeferredRegister,
            net.neoforged.neoforge.registries.DeferredRegister$Items,
            net.neoforged.neoforge.registries.DeferredRegister$DataComponents,
            net.neoforged.neoforge.registries.DeferredHolder,
            net.minecraft.world.entity.EntityType,
            net.minecraft.world.entity.EntityType$Builder,
            net.minecraft.world.entity.EntityType$EntityFactory,
            net.minecraft.world.entity.MobCategory,
            net.minecraft.world.entity.Entity,
            net.minecraft.network.syncher.SynchedEntityData,
            net.minecraft.network.syncher.SynchedEntityData$Builder,
            net.minecraft.network.syncher.EntityDataAccessor,
            net.minecraft.network.syncher.EntityDataSerializers,
            net.minecraft.world.item.Item,
            net.minecraft.world.item.Item$Properties,
            net.minecraft.world.item.ItemStack,
            net.minecraft.world.item.DyeColor,
            net.minecraft.core.component.DataComponentType,
            net.minecraft.core.component.DataComponentType$Builder,
            net.minecraft.world.item.CreativeModeTab,
            net.minecraft.world.item.CreativeModeTab$Builder,
            net.minecraft.world.item.CreativeModeTab$Output,
            net.minecraft.world.item.CreativeModeTab$DisplayItemsGenerator,
            net.minecraft.world.item.CreativeModeTab$ItemDisplayParameters,
            net.minecraft.core.registries.Registries,
            net.minecraft.resources.ResourceLocation,
            net.minecraft.network.chat.Component,
            net.minecraft.nbt.CompoundTag,
            net.minecraft.network.codec.ByteBufCodecs
        run: |
          # Fully qualified names, separated by commas (nested classes with $); a failure does not stop the others.
          status=0
          IFS=',' read -ra VALUES <<< "$INSPECT_VALUES"
          for raw in "${VALUES[@]}"; do
            value="$(echo "$raw" | xargs)"
            if [ -z "$value" ]; then
              continue
            fi
            echo "##### inspectApi: $value"
            gradle inspectApi "-PclassName=$value" --console=plain -q || status=1
          done
          exit $status

      # TEMPORARILY DISABLED to save time while inspecting the API. Remove the "if: false" lines to re-enable.
      - name: Build
        if: ${{ false }}
        run: gradle build --stacktrace

      - name: Upload jars
        if: ${{ false }}
        uses: actions/upload-artifact@v4
        with:
          name: htzcars-jars
          path: build/libs/*.jar
          if-no-files-found: error
