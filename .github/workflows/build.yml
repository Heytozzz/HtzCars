name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3' # Pinned. Quotes are required so YAML does not parse it as a number.

      # TEMPORARY: API inspection step (it never fails the job). Remove it (and re-enable the build below) once its results are no longer needed.
      # One entry per line. Formats:
      #   SimpleName@package.prefix#regex   the class is looked up by simple name (findClass) and only matches
      #                                     whose full name starts with the prefix are inspected
      #   fully.qualified.Name#regex        the class is inspected directly
      # "#regex" is optional: with it, only the public/protected fields and methods whose line matches are printed
      # (constructors are always printed, private members never).
      - name: Inspect APIs (TEMPORARY)
        continue-on-error: true
        env:
          INSPECT_ENTRIES: |-
            ICondition@net.neoforged.neoforge.common.conditions.
            ICondition$IContext@net.neoforged.neoforge.common.conditions.
            NeoForgeRegistries@net.neoforged.neoforge.registries.#\.CONDITION_SERIALIZERS$
            Codec@com.mojang.serialization.#\.(STRING|fieldOf)(\(|$)
            MapCodec@com.mojang.serialization.#\.xmap\(
        run: |
          status=0

          inspect_class() {
            local class="$1" regex="$2" out
            echo "##### inspectApi: $class"
            # "< /dev/null" so gradle does not consume the entries read by the caller loop.
            if out="$(gradle inspectApi "-PclassName=$class" --console=plain -q 2>&1 < /dev/null)"; then
              echo "$out" | RE="$regex" awk '
                BEGIN { re = ENVIRON["RE"]; sec = ""; shown = 0; total = 0 }
                /^=== / || /^Superclass:/ { print; next }
                /^(Interfaces|Constructors|Fields|Methods):/ { sec = $0; sub(/:$/, "", sec); print; next }
                sec == "Interfaces" { print; next }
                sec == "Constructors" { if ($0 ~ /^  (public|protected)/) print; next }
                $0 ~ /^  (public|protected)/ { total++; if (re == "" || $0 ~ re) { print; shown++ } }
                END { print "(" shown " of " total " public/protected fields and methods shown)" }
              '
            else
              status=1
              echo "FAILED: $class"
              echo "$out" | grep -m3 -E 'Class not found|Could not load|went wrong|Exception' || true
            fi
          }

          while IFS= read -r entry; do
            entry="$(echo "$entry" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            if [ -z "$entry" ]; then
              continue
            fi
            spec="${entry%%#*}"
            regex=""
            if [ "$spec" != "$entry" ]; then
              regex="${entry#*#}"
            fi
            name="${spec%%@*}"
            prefix=""
            if [ "$name" != "$spec" ]; then
              prefix="${spec#*@}"
            fi
            case "$name" in
              *.*)
                inspect_class "$name" "$regex"
                ;;
              *)
                echo "##### findClass: $name (prefix: $prefix)"
                found="$(gradle findClass "-PsimpleName=$name" --console=plain -q 2>&1 < /dev/null | grep -E '^  [A-Za-z_]' | sed 's/^  //' || true)"
                matched=0
                for candidate in $found; do
                  case "$candidate" in
                    "$prefix"*)
                      matched=1
                      inspect_class "$candidate" "$regex"
                      ;;
                  esac
                done
                if [ "$matched" -eq 0 ]; then
                  status=1
                  echo "NO MATCH for $name with prefix $prefix. Candidates: ${found:-none}"
                fi
                ;;
            esac
          done <<< "$INSPECT_ENTRIES"
          exit $status

      - name: Build
        run: gradle build --stacktrace

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: htzcars-jars
          path: build/libs/*.jar
          if-no-files-found: error
